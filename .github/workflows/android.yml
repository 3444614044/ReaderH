name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 配置了 KEYSTORE_BASE64 secret 时用正式签名，否则回退 debug 签名（APK 仍可安装）
      - name: Decode release keystore (optional)
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets."
          else
            echo "No KEYSTORE_BASE64 secret, release APK will be debug-signed."
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p dist
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          SHA=${GITHUB_SHA::7}
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="ReaderH-${GITHUB_REF_NAME}-${SHA}.apk"
          else
            NAME="ReaderH-v${VER}-${GITHUB_REF_NAME}-${SHA}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReaderH-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
