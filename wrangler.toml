name = "readerh"
main = "worker/src/index.ts"
tsconfig = "worker/tsconfig.json"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源目录（Worker + Assets 模式）
[assets]
directory = "dist"
binding = "ASSETS"

# 环境变量（Pages 建议在 Dashboard 设置，避免密钥入仓）
[vars]
ENVIRONMENT = "production"

# 生产域名（可选）
# [[routes]]
# pattern = "readerh.example.com"
# custom_domain = true